[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracenest"
version = "0.1.0"
description = "Understand every change your AI agent makes. Production-minded, cross-platform CLI tool for reviewing AI coding sessions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "TraceNest Maintainers", email = "maintainers@tracenest.dev" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
]

[project.scripts]
tracenest = "tracenest.cli:app"

[project.urls]
Homepage = "https://github.com/tracenest/tracenest"
Documentation = "https://github.com/tracenest/tracenest/tree/main/docs"
Repository = "https://github.com/tracenest/tracenest.git"
Issues = "https://github.com/tracenest/tracenest/issues"
Changelog = "https://github.com/tracenest/tracenest/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tracenest"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/examples",
    "/tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.12"
packages = ["tracenest"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
